name: CI
on:
  push:
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Release -DFORGE_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build-ci --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build-ci -C Release --output-on-failure
